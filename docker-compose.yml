services:
    db:
        image: postgres:16-alpine
        restart: always
        container_name: books_exchange_db
        volumes:
            - pg_data:/var/lib/postgresql/data/
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pg_data:
