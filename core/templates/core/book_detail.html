{% extends "config/base.html" %}

{% block title %}About{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4 mx-md-4">{{ book.name }}</h1>
    <div class="mx-md-4">
        {% if book.image %}
            <img src="{{ MEDIA_URL }}{{ book.image.url }}" alt="{{ book.name }}" class="img-fluid float-start me-4 mb-3">
        {% endif %}
        <p><strong>Автор:</strong> {{ book.author }}</p>
        <p><strong>Год публикации:</strong> {{ book.publish_year }}</p>
        {% if book.annotation %}
            <p><strong>Аннотация:</strong> {{ book.annotation }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
