{% extends "config/base.html" %}

{% block title %}Author detail{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4 mx-md-4">Ниже представлены все книги автора</h1>
    <h2>{{ author.name }}</h2>
    <hr/>
    <div class="row mt-4 mx-md-4">
    {% for book in author.books.all %}
        <div class="col-md-4">
            {% include "core/includes/book_card.html" with book=book %}
        </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
